name: Build GDExtension

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons-cache
  BOOST_VERSION: "1.86.0"

jobs:
  build:
    name: ${{ matrix.name }}
    # Upgraded to 24.04 for better C++20 support (GCC 13)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Debug
            runner: ubuntu-24.04
            platform: linux
            target: template_debug
            arch: x86_64

          - name: Linux Release
            runner: ubuntu-24.04
            platform: linux
            target: template_release
            arch: x86_64

          - name: Windows Debug
            runner: windows-2022
            platform: windows
            target: template_debug
            arch: x86_64

          - name: Windows Release
            runner: windows-2022
            platform: windows
            target: template_release
            arch: x86_64

          - name: Android Debug
            runner: ubuntu-24.04
            platform: android
            target: template_debug
            arch: arm64

          - name: Android Release
            runner: ubuntu-24.04
            platform: android
            target: template_release
            arch: arm64

          - name: Web Debug
            runner: ubuntu-24.04
            platform: web
            target: template_debug
            arch: wasm32

          - name: Web Release
            runner: ubuntu-24.04
            platform: web
            target: template_release
            arch: wasm32

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: pip install scons

      # ── Platform-specific setup ─────────────────────────────────────

      - name: (Linux) Install build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential

      - name: (Android) Set up NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: (Android) Set NDK environment
        if: matrix.platform == 'android'
        run: |
          # We set it here, and the build step will access it via $ANDROID_NDK_ROOT
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: (Web) Set up Emscripten
        if: matrix.platform == 'web'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.64"

      # ── Boost headers ──────────────────────────────────────────────

      - name: Cache Boost headers
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: thirdparty/boost
          key: boost-${{ env.BOOST_VERSION }}

      - name: Download Boost headers
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: python tools/setup_boost.py

      # ── SCons cache ────────────────────────────────────────────────

      - name: Cache SCons
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            scons-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}-

      # ── Build ──────────────────────────────────────────────────────

      - name: Build GDIFC
        shell: bash
        run: |
          # Define common arguments
          SCONS_ARGS="platform=${{ matrix.platform }} target=${{ matrix.target }} arch=${{ matrix.arch }} cpp_std=c++20 -j4"
          
          # Add NDK path only for Android
          if [ "${{ matrix.platform }}" == "android" ]; then
            # Use the shell variable $ANDROID_NDK_ROOT instead of the GHA context
            SCONS_ARGS="$SCONS_ARGS android_ndk_path=$ANDROID_NDK_ROOT"
          fi
          
          scons $SCONS_ARGS

      # ── Upload artifact ────────────────────────────────────────────

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: gdifc-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}
          path: addons/GDIFC/libgdifc*
          if-no-files-found: error

  package:
    name: Package All Platforms
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gdifc-*

      - name: Collect binaries
        run: |
          mkdir -p package/addons/GDIFC
          cp ifc-godot-project/addons/GDIFC/gdifc.gdextension package/addons/GDIFC/
          cp ifc-godot-project/addons/GDIFC/plugin.cfg package/addons/GDIFC/ || true
          cp -r ifc-godot-project/addons/GDIFC/assets package/addons/GDIFC/ || true
          cp -r ifc-godot-project/addons/GDIFC/settings package/addons/GDIFC/ || true
          cp ifc-godot-project/addons/GDIFC/*.gd package/addons/GDIFC/ || true
          cp ifc-godot-project/addons/GDIFC/*.tscn package/addons/GDIFC/ || true
          for dir in artifacts/gdifc-*/; do
            cp "$dir"/libgdifc* package/addons/GDIFC/ || true
          done

      - name: Upload complete addon
        uses: actions/upload-artifact@v4
        with:
          name: GDIFC-addon-all-platforms
          path: package/
          if-no-files-found: error
