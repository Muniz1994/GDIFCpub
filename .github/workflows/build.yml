name: Build GDExtension

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons-cache
  BOOST_VERSION: "1.86.0"

jobs:
  build:
    name: ${{ matrix.name }}
    # Upgraded to 24.04 for better C++20 support (GCC 13)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Debug
            runner: ubuntu-24.04
            platform: linux
            target: template_debug
            arch: x86_64

          - name: Linux Release
            runner: ubuntu-24.04
            platform: linux
            target: template_release
            arch: x86_64

          - name: Windows Debug
            runner: windows-2022
            platform: windows
            target: template_debug
            arch: x86_64

          - name: Windows Release
            runner: windows-2022
            platform: windows
            target: template_release
            arch: x86_64

          - name: Android Debug
            runner: ubuntu-24.04
            platform: android
            target: template_debug
            arch: arm64

          - name: Android Release
            runner: ubuntu-24.04
            platform: android
            target: template_release
            arch: arm64

          - name: Web Debug
            runner: ubuntu-24.04
            platform: web
            target: template_debug
            arch: wasm32

          - name: Web Release
            runner: ubuntu-24.04
            platform: web
            target: template_release
            arch: wasm32

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: pip install scons

      # ── Platform-specific setup ─────────────────────────────────────

      - name: (Linux) Install build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential

      - name: (Android) Set up NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28b

      - name: (Android) Set ANDROID_NDK_ROOT
        if: matrix.platform == 'android'
        run: |
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_HOME=" >> $GITHUB_ENV

      - name: (Web) Set up Emscripten
        if: matrix.platform == 'web'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.64"

      # ── Boost headers ──────────────────────────────────────────────

      - name: Cache Boost headers
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: thirdparty/boost
          key: boost-${{ env.BOOST_VERSION }}

      - name: Download Boost headers
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: python tools/setup_boost.py

      # ── SCons cache ────────────────────────────────────────────────

      - name: Cache SCons
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            scons-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}-

      # ── Build ──────────────────────────────────────────────────────

      - name: Build GDIFC
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ "${{ matrix.platform }}" = "web" ]; then
            EXTRA_ARGS="optimize=size"
          fi
          scons platform=${{ matrix.platform }} target=${{ matrix.target }} arch=${{ matrix.arch }} $EXTRA_ARGS -j4

      # ── Web WASM post-processing ──────────────────────────────────

      - name: (Web) Optimize WASM with wasm-opt
        if: matrix.platform == 'web'
        run: |
          sudo apt-get install -y binaryen
          WASM_FILE=$(find addons/GDIFC -name '*.wasm' | head -1)
          echo "Before wasm-opt: $(ls -lh "$WASM_FILE" | awk '{print $5}')"
          wasm-opt -Oz --strip-debug --strip-producers -o "${WASM_FILE}.opt" "${WASM_FILE}"
          mv "${WASM_FILE}.opt" "${WASM_FILE}"
          echo "After wasm-opt:  $(ls -lh "$WASM_FILE" | awk '{print $5}')"

      - name: (Web) Brotli-compress WASM
        if: matrix.platform == 'web'
        run: |
          sudo apt-get install -y brotli
          WASM_FILE=$(find addons/GDIFC -name '*.wasm' | head -1)
          brotli -q 11 -o "${WASM_FILE}.br" "${WASM_FILE}"
          echo "Raw WASM:    $(ls -lh "$WASM_FILE" | awk '{print $5}')"
          echo "Brotli WASM: $(ls -lh "${WASM_FILE}.br" | awk '{print $5}')"

      - name: (Web) Check WASM size
        if: matrix.platform == 'web'
        run: |
          WASM_FILE=$(find addons/GDIFC -name '*.wasm' ! -name '*.br' | head -1)
          SIZE=$(stat -c%s "$WASM_FILE")
          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
          echo "WASM size: ${SIZE_MB} MiB"
          if [ "$SIZE" -gt 7340032 ]; then
            echo "::warning::WASM binary is ${SIZE_MB} MiB — exceeds 7 MiB target"
          else
            echo "WASM binary is within the 7 MiB target"
          fi

      # ── Upload artifact ────────────────────────────────────────────

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: gdifc-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            addons/GDIFC/libgdifc*
            addons/GDIFC/*.wasm.br
          if-no-files-found: error

  package:
    name: Package All Platforms
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gdifc-*

      - name: Collect binaries
        run: |
          mkdir -p package/addons/GDIFC
          cp ifc-godot-project/addons/GDIFC/gdifc.gdextension package/addons/GDIFC/
          cp ifc-godot-project/addons/GDIFC/plugin.cfg package/addons/GDIFC/ || true
          cp -r ifc-godot-project/addons/GDIFC/assets package/addons/GDIFC/ || true
          cp -r ifc-godot-project/addons/GDIFC/settings package/addons/GDIFC/ || true
          cp ifc-godot-project/addons/GDIFC/*.gd package/addons/GDIFC/ || true
          cp ifc-godot-project/addons/GDIFC/*.tscn package/addons/GDIFC/ || true
          for dir in artifacts/gdifc-*/; do
            cp "$dir"/libgdifc* package/addons/GDIFC/ || true
          done
          
      - name: Commit binaries to repo
        if: github.event_name != 'pull_request'
        run: |
          cp package/addons/GDIFC/libgdifc* addons/GDIFC/
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f addons/GDIFC/libgdifc*
          git diff --cached --quiet || git commit -m "ci: update prebuilt binaries [skip ci]"
          git push

      - name: Commit binaries to repo
        if: github.event_name != 'pull_request'
        run: |
          cp package/addons/GDIFC/libgdifc* addons/GDIFC/
          cp ./LICENCE.md addons/GDIFC/
          cp ./README.md addons/GDIFC/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f addons/GDIFC/libgdifc*
          git diff --cached --quiet || git commit -m "ci: update prebuilt binaries [skip ci]"
          git push

      - name: Upload complete addon
        uses: actions/upload-artifact@v4
        with:
          name: GDIFC-addon-all-platforms
          path: package/
          if-no-files-found: error
