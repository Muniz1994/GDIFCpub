name: Build GDExtension

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "New version for this build (e.g. 1.2.0-alpha). Leave empty to keep the current one."
        required: false
        default: ""

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons-cache
  BOOST_VERSION: "1.86.0"

jobs:
  build:
    name: ${{ matrix.name }}
    # Upgraded to 24.04 for better C++20 support (GCC 13)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # - name: Linux Debug
          #   runner: ubuntu-24.04
          #   platform: linux
          #   target: template_debug
          #   arch: x86_64

          - name: Linux Release
            runner: ubuntu-24.04
            platform: linux
            target: template_release
            arch: x86_64

          # - name: Windows Debug
          #   runner: windows-2022
          #   platform: windows
          #   target: template_debug
          #   arch: x86_64

          - name: Windows Release
            runner: windows-2022
            platform: windows
            target: template_release
            arch: x86_64

          # - name: Android Debug
          #   runner: ubuntu-24.04
          #   platform: android
          #   target: template_debug
          #   arch: arm64

          - name: Android Release
            runner: ubuntu-24.04
            platform: android
            target: template_release
            arch: arm64

          # - name: Web Debug
          #   runner: ubuntu-24.04
          #   platform: web
          #   target: template_debug
          #   arch: wasm32

          - name: Web Release
            runner: ubuntu-24.04
            platform: web
            target: template_release
            arch: wasm32

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: pip install scons

      # ── Platform-specific setup ─────────────────────────────────────

      - name: (Linux) Install build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential

      - name: (Android) Set up NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28b

      - name: (Android) Set ANDROID_NDK_ROOT
        if: matrix.platform == 'android'
        run: |
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_HOME=" >> $GITHUB_ENV

      - name: (Web) Set up Emscripten
        if: matrix.platform == 'web'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.64"

      # ── Boost headers ──────────────────────────────────────────────

      - name: Cache Boost headers
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: thirdparty/boost
          key: boost-${{ env.BOOST_VERSION }}

      - name: Download Boost headers
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: python tools/setup_boost.py

      # ── SCons cache ────────────────────────────────────────────────

      - name: Cache SCons
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            scons-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}-

      # ── Build ──────────────────────────────────────────────────────

      - name: Build GDIFC
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ "${{ matrix.platform }}" = "web" ]; then
            EXTRA_ARGS="optimize=size"
          fi
          scons platform=${{ matrix.platform }} target=${{ matrix.target }} arch=${{ matrix.arch }} $EXTRA_ARGS -j4

      # ── Upload artifact ────────────────────────────────────────────

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: gdifc-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            addons/GDIFC/libgdifc*
            addons/GDIFC/*.wasm.br
          if-no-files-found: error

  package:
    name: Package All Platforms
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A newer push will run its own package job; only the tip commits and releases,
      # so binaries and builds always match the newest source.
      - name: Check this commit is still the branch tip
        id: tip
        if: github.event_name != 'pull_request'
        run: |
          git fetch --quiet origin "$GITHUB_REF"
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$GITHUB_REF moved past this commit; skipping commit and release"
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
          fi

      # Moves the Unreleased changelog entries into a new build and bumps plugin.cfg.
      # Runs before packaging so the packaged plugin.cfg and CHANGELOG.md carry the new build.
      - name: Cut build
        id: bump
        if: steps.tip.outputs.is_tip == 'true' && github.ref == 'refs/heads/master'
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          python3 tools/bump_build.py --skip-if-empty --notes "$RUNNER_TEMP/release-notes.md" \
            ${NEW_VERSION:+--version "$NEW_VERSION"}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gdifc-*

      - name: Collect binaries
        run: |
          mkdir -p package/addons/GDIFC
          cp addons/GDIFC/gdifc.gdextension package/addons/GDIFC/
          cp ifc-godot-project/addons/GDIFC/plugin.cfg package/addons/GDIFC/ || true
          cp CHANGELOG.md package/addons/GDIFC/
          cp -r ifc-godot-project/addons/GDIFC/assets package/addons/GDIFC/ || true
          cp -r ifc-godot-project/addons/GDIFC/settings package/addons/GDIFC/ || true
          cp ifc-godot-project/addons/GDIFC/*.gd package/addons/GDIFC/ || true
          cp ifc-godot-project/addons/GDIFC/*.tscn package/addons/GDIFC/ || true
          for dir in artifacts/gdifc-*/; do
            cp "$dir"/libgdifc* package/addons/GDIFC/ || true
          done
          
      - name: Commit binaries and build to repo
        if: steps.tip.outputs.is_tip == 'true'
        env:
          RELEASED: ${{ steps.bump.outputs.released }}
          VERSION: ${{ steps.bump.outputs.version }}
          BUILD: ${{ steps.bump.outputs.build }}
        run: |
          cp package/addons/GDIFC/libgdifc* addons/GDIFC/
          cp ./LICENCE.md addons/GDIFC/
          cp ./README.md addons/GDIFC/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f addons/GDIFC/libgdifc*
          if [ "$RELEASED" = "true" ]; then
            TAG="v$VERSION-build.$BUILD"
            git add CHANGELOG.md addons/GDIFC/plugin.cfg ifc-godot-project/addons/GDIFC/plugin.cfg
            git commit -m "ci: release $VERSION build $BUILD [skip ci]"
            git tag "$TAG"
            git push --atomic origin "HEAD:$GITHUB_REF" "refs/tags/$TAG"
          else
            git diff --cached --quiet || git commit -m "ci: update prebuilt binaries [skip ci]"
            git push origin "HEAD:$GITHUB_REF"
          fi

      - name: Upload complete addon
        uses: actions/upload-artifact@v4
        with:
          name: GDIFC-addon-all-platforms
          path: package/
          if-no-files-found: error

      # Created as a draft: review it on the Releases page and click Publish.
      - name: Draft GitHub release
        if: steps.bump.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          BUILD: ${{ steps.bump.outputs.build }}
        run: |
          TAG="v$VERSION-build.$BUILD"
          ZIP="GDIFC-$VERSION-build.$BUILD.zip"
          (cd package && zip -qr "../$ZIP" addons)
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" "$ZIP" --draft \
            --title "GDIFC $VERSION (build $BUILD)" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            $PRERELEASE
